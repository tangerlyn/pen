name: nibpen
description: 만년필·잉크·노트 전문 커뮤니티 + 중고거래 앱
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 상태관리
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_remote_config: ^5.1.5
  flutter_local_notifications: ^18.0.1

  # 앱 정보
  package_info_plus: ^8.0.0

  # 라우팅
  go_router: ^14.2.0

  # 이미지
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # UI
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.0+3
  photo_view: ^0.15.0
  badges: ^3.1.2
  confetti: ^0.7.0

  # 유틸
  connectivity_plus: ^6.1.1
  intl: ^0.19.0
  timeago: ^3.7.0
  uuid: ^4.4.2
  url_launcher: ^6.3.0
  share_plus: ^10.0.0
  gal: ^1.1.2

  # 소셜 로그인
  sign_in_with_apple: ^6.1.1
  kakao_flutter_sdk_user: ^1.9.7
  flutter_naver_login: ^2.1.1
  crypto: ^3.0.6

  # 로컬 저장
  shared_preferences: ^2.3.2
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10
  firebase_auth: ^5.7.0
  csv: ^6.0.0
  palette_generator: ^0.3.3+7
  reorderable_grid_view: ^2.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.5
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon1.png"
  adaptive_icon_background: "#1C3458"
  adaptive_icon_foreground: "assets/icons/app_icon1.png"

flutter_native_splash:
  color: "#1C3458"
  image: assets/icons/app_icon2.png
  android: true
  ios: true
  android_12:
    color: "#1C3458"
    image: assets/icons/app_icon2.png
    icon_background_color: "#1C3458"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/info_csv/
    - assets/shapes/
